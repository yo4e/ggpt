<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <title>爺ぴーてぃー（GGPT）</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="title" id="titleArea">
        <h1>爺ぴーてぃー</h1>
        <div class="subtitle">GGPT-2.1 — Generative Grandpa Pattern Talker</div>
      </div>
      <div class="settings">
        <button class="gear-btn" id="settingsBtn" type="button" aria-expanded="false" aria-haspopup="true">⚙</button>
        <div class="menu" id="settingsMenu" role="menu" aria-label="設定">
          <button class="menu-item" id="resetBtn" type="button" role="menuitem">会話履歴をリセット</button>
          <div class="ad-slot" id="adSlot" aria-label="広告枠">
            <iframe
              title="Spotify album"
              src="https://open.spotify.com/embed/album/6ZH6p14vtIuwca36ayikOQ?utm_source=generator"
              width="100%"
              height="152"
              frameborder="0"
              allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
              loading="lazy"
            ></iframe>
            <div class="pr">PR</div>
          </div>
        </div>
      </div>
    </header>

    <main id="chat" class="chat" aria-live="polite"></main>

    <footer class="input-bar">
      <input id="userInput" type="text" placeholder="話しかけてみる…" autocomplete="off" />
      <button id="sendBtn" type="button">送信</button>
    </footer>
  </div>

  <script src="app.js" defer></script>
</body>
</html>
